name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest --cov=dhtrack --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run ruff
        run: |
          ruff check dhtrack/ tests/
          ruff format --check dhtrack/ tests/

      - name: Run black
        run: |
          black --check dhtrack/ tests/

      - name: Run isort
        run: |
          isort --check --diff dhtrack/ tests/

      - name: Run mypy
        run: |
          mypy dhtrack/

  build:
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build source distribution and wheel (PEP 517)
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --wheel

      - name: Build wheelhouse with PyQt6 (PEP 508 extra gui)
        run: |
          python -m pip wheel ".[gui]" -w wheelhouse

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dhtrack-dist-${{ runner.os }}
          path: dist/

      - name: Upload PyQt6 wheelhouse (dhtrack + GUI deps)
        uses: actions/upload-artifact@v4
        with:
          name: dhtrack-wheelhouse-pyqt6-${{ runner.os }}
          path: wheelhouse/