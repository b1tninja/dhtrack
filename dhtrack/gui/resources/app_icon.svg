<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ff5ff"/>
      <stop offset="100%" stop-color="#00c8e8"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00a8cc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="radarClip">
      <path d="M 512 512 L 512 32 A 480 480 0 0 1 992 512 Z"/>
    </clipPath>
  </defs>

  <!-- Radar sweep (upper-right), transparent outside wedge -->
  <g clip-path="url(#radarClip)" opacity="0.55">
    <ellipse cx="512" cy="512" rx="380" ry="380" fill="url(#radarGrad)"/>
  </g>

  <!-- Faint guiding rings -->
  <circle cx="512" cy="512" r="178" fill="none" stroke="#4fd4e8" stroke-width="2" stroke-opacity="0.14" stroke-dasharray="10 18"/>
  <circle cx="512" cy="512" r="264" fill="none" stroke="#4fd4e8" stroke-width="1.5" stroke-opacity="0.1"/>

  <!-- Spokes -->
  <g stroke="#3ae8ff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.92" filter="url(#glowSoft)">
    <line x1="512" y1="512" x2="806" y2="512"/>
    <line x1="512" y1="512" x2="719.9" y2="304.1"/>
    <line x1="512" y1="512" x2="512" y2="218"/>
    <line x1="512" y1="512" x2="304.1" y2="304.1"/>
    <line x1="512" y1="512" x2="218" y2="512"/>
    <line x1="512" y1="512" x2="304.1" y2="719.9"/>
    <line x1="512" y1="512" x2="512" y2="806"/>
    <line x1="512" y1="512" x2="719.9" y2="719.9"/>
  </g>

  <!-- Peripheral ring nodes (hollow) -->
  <g fill="none" stroke="#52f2ff" stroke-width="8" opacity="0.95" filter="url(#glowSoft)">
    <circle cx="806" cy="512" r="18"/>
    <circle cx="719.9" cy="304.1" r="18"/>
    <circle cx="512" cy="218" r="18"/>
    <circle cx="304.1" cy="304.1" r="18"/>
    <circle cx="218" cy="512" r="18"/>
    <circle cx="304.1" cy="719.9" r="18"/>
    <circle cx="512" cy="806" r="18"/>
    <circle cx="719.9" cy="719.9" r="18"/>
  </g>

  <!-- Hex hub -->
  <polygon points="574,512 532,458 481,458 450,512 481,566 532,566"
           fill="url(#hubGrad)" stroke="#bff8ff" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
