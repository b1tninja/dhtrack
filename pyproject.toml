[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhtrack"
version = "2.0.0"
description = "A modern DHT swarm inspector for BitTorrent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "dhtrack contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File/Text Transfer (FTP)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PyGObject>=3.40",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.0"]
gui = ["python-gtksingleapplication"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "ruff>=0.4.0",
    "black>=24.0",
    "isort>=5.13",
    "pre-commit>=3.5",
]

[project.scripts]
dhtrack = "dhtrack.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
dhtrack = ["dhtrack.glade"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -v --cov=dhtrack --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true