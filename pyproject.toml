[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhtrack"
version = "2.0.0"
description = "A modern DHT swarm inspector for BitTorrent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "dhtrack contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File/Text Transfer (FTP)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
mongo = ["pymongo>=4.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "pillow>=10.0",
    "pre-commit>=3.5",
    "resvg-py>=0.3.1",
    "ruff>=0.4.0",
]

[project.scripts]
dhtrack = "dhtrack.cli:main"
dhtrack-gui = "dhtrack.gui.__main__:main"

[project.gui-scripts]
dhtrack-inspector = "dhtrack.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"dhtrack" = [
    "gui/styles/*.qss",
    "gui/resources/*.png",
    "gui/resources/*.svg",
    "gui/resources/*.ico",
]


[tool.ruff]
target-version = "py310"
line-length = 120

# Black and Ruff disagree on wrapping for this integration test; CI runs both formatters.
[tool.ruff.format]
exclude = ["tests/test_internet_archlinux_metadata.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

# PyQt QAbstractItemModel and signals use camelCase method / attribute names required by Qt.
[tool.ruff.lint.per-file-ignores]
"dhtrack/gui/**/*.py" = ["N802"]
# isort (CI) and Ruff I001 disagree on ``from … import (…, X as Y, …)`` merges here.
"tests/test_dht.py" = ["I001"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -v"
markers = [
    "slow: long-running tests (often network/integration)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
# Optional runtime deps (Mongo, Qt) are not installed in CI during the lint job.
ignore_missing_imports = true
# Qt GUI is exercised at runtime with PyQt6; typing it cleanly needs stubs + sizable refactors.
exclude = "(?x)(^|/)dhtrack/gui/.*"

# Gradual typing: these modules remain partially typed against bytes-keyed bencode/TCP wire data.
[[tool.mypy.overrides]]
module = [
    "dhtrack.bep32",
    "dhtrack.bloom_filter",
    "dhtrack.cli",
    "dhtrack.dht",
    "dhtrack.dht_manager",
    "dhtrack.extension",
    "dhtrack.lsd",
    "dhtrack.metadata_retriever",
    "dhtrack.peer",
    "dhtrack.piece_selector",
    "dhtrack.quic",
    "dhtrack.storage",
    "dhtrack.torrent",
    "dhtrack.tracker",
    "dhtrack.udp_tracker",
    "dhtrack.utp",
    "dhtrack.webseed",
]
ignore_errors = true